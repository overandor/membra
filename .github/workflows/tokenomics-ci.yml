name: Tokenomics CI

on:
  push:
    branches: [main]
    paths:
      - 'programs/membra_tokenomics/**'
      - 'tests/membra_tokenomics.ts'
      - 'clients/typescript/src/membra_tokenomics.ts'
      - '.github/workflows/tokenomics-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'programs/membra_tokenomics/**'
      - 'tests/membra_tokenomics.ts'
      - 'clients/typescript/src/membra_tokenomics.ts'
      - '.github/workflows/tokenomics-ci.yml'

# Note: anchor build and anchor test require a local Solana/Anchor toolchain
# (solana-cli, avm, cargo-build-sbf) which is too heavy for standard GitHub Actions.
# Run `anchor build` and `anchor test` locally before merging to main.

jobs:
  rust-tokenomics-ci:
    name: Rust Tokenomics Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: programs/membra_tokenomics
      - run: cargo fmt --manifest-path programs/membra_tokenomics/Cargo.toml -- --check
      - run: cargo clippy --manifest-path programs/membra_tokenomics/Cargo.toml -- -D warnings
      - run: cargo build --manifest-path programs/membra_tokenomics/Cargo.toml

  ts-sdk-ci:
    name: TypeScript SDK Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix clients/typescript
      - run: npm run build --prefix clients/typescript || echo "Build step requires IDL from anchor build"
