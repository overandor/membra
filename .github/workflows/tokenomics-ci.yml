name: Tokenomics CI

on:
  push:
    branches: [main]
    paths:
      - 'programs/membra_tokenomics/**'
      - 'tests/membra_tokenomics.ts'
      - 'clients/typescript/src/membra_tokenomics.ts'
  pull_request:
    branches: [main]
    paths:
      - 'programs/membra_tokenomics/**'
      - 'tests/membra_tokenomics.ts'
      - 'clients/typescript/src/membra_tokenomics.ts'

jobs:
  rust-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path programs/membra_tokenomics/Cargo.toml -- --check
      - run: cargo clippy --manifest-path programs/membra_tokenomics/Cargo.toml -- -D warnings

  rust-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --manifest-path programs/membra_tokenomics/Cargo.toml

  typescript-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --prefix clients/typescript
      - run: npm run lint --prefix clients/typescript || true
      - run: npm run build --prefix clients/typescript
