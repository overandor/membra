# MEMBRA API Render Configuration
# Deploy to Render: https://render.com

services:
  - type: web
    name: membra-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: membra-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: membra-redis
          property: connectionString
      - key: PORT
        value: 8000

databases:
  - name: membra-db
    databaseName: membra
    user: membra

redis:
  - name: membra-redis
    maxmemoryPolicy: allkeys-lru
