# MEMBRA - Render Deployment Configuration
# Deploys both the Next.js web app and FastAPI backend

services:
  - type: web
    name: membra-web
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    rootDir: apps/web
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: ${MEMBRA_API_URL}

  - type: web
    name: membra-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT
    rootDir: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: membra-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: membra-redis
          property: connectionString
      - key: PORT
        value: 8000

databases:
  - name: membra-db
    databaseName: membra
    user: membra

redis:
  - name: membra-redis
    maxmemoryPolicy: allkeys-lru
