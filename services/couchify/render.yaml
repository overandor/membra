services:
  - type: web
    name: couchify-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python seed_db.py
    startCommand: uvicorn api_v2:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: couchify-db
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_CONNECT_REDIRECT_URI
        sync: false
      - key: HUGGINGFACE_TOKEN
        sync: false

databases:
  - name: couchify-db
    databaseName: couchify
    plan: free
